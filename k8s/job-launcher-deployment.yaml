apiVersion: apps/v1
kind: Deployment
metadata:
  name: job-launcher
  namespace: default
spec:
  replicas: 1           # exactly one launcher — avoids double-dequeuing
  selector:
    matchLabels:
      app: job-launcher
  template:
    metadata:
      labels:
        app: job-launcher
    spec:
      serviceAccountName: job-launcher-sa    # attach the RBAC identity
      containers:
        - name: launcher
          image: job-launcher:v1
          imagePullPolicy: Never
          env:
            - name: REDIS_HOST
              value: "redis-service"
            - name: WORKER_IMAGE
              value: "agent-worker:v5"
            - name: NAMESPACE
              value: "default"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"