# charts/agent-runner/templates/secret.yaml
{{- if .Values.anthropicApiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: agent-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "agent-runner.labels" . | nindent 4 }}
type: Opaque
stringData:
  ANTHROPIC_API_KEY: {{ .Values.anthropicApiKey | quote }}
{{- else }}
{{- fail "anthropicApiKey must be set. Use --set anthropicApiKey=<your-key>" }}
{{- end }}