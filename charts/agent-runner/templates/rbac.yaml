# charts/agent-runner/templates/rbac.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: job-launcher-sa
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "agent-runner.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: job-launcher-role
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "agent-runner.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: job-launcher-binding
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "agent-runner.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: job-launcher-sa
    namespace: {{ .Values.namespace }}
roleRef:
  kind: Role
  apiGroup: rbac.authorization.k8s.io
  name: job-launcher-role