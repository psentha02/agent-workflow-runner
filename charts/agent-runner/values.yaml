# charts/agent-runner/values.yaml

# ── Namespace ────────────────────────────────────────────
namespace: agent-runner

# ── FastAPI ──────────────────────────────────────────────
fastapi:
  image:
    repository: agent-api
    tag: "v4"
    pullPolicy: Never        # Never = use locally imported image
  replicas: 1
  port: 8000
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "500m"

# ── Job Launcher ─────────────────────────────────────────
launcher:
  image:
    repository: job-launcher
    tag: "v1"
    pullPolicy: Never
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "200m"

# ── Worker ───────────────────────────────────────────────
worker:
  image:
    repository: agent-worker
    tag: "v5"
    pullPolicy: Never
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  job:
    backoffLimit: 2
    activeDeadlineSeconds: 300
    ttlSecondsAfterFinished: 600

# ── Redis ────────────────────────────────────────────────
redis:
  image:
    repository: redis
    tag: "7.2-alpine"
    pullPolicy: IfNotPresent
  storage: "1Gi"
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "200m"

# ── Secrets ──────────────────────────────────────────────
# Set via --set anthropicApiKey=<key> at install time
# Never hardcode here
anthropicApiKey: ""

# ── Observability ─────────────────────────────────────────
serviceMonitor:
  enabled: true
  interval: "15s"
  scrapeTimeout: "10s"